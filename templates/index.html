
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud File Upload</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            color: #222;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #243b55;
            margin-bottom: 15px;
        }

        p {
            color: #555;
        }

        input[type="file"] {
            margin: 20px 0;
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            background: #243b55;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        button:hover {
            background: #141e30;
        }

        .message {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Cloud File Upload</h1>

        <p>Upload your files securely to AWS S3</p>

        <form action="/upload" method="POST"
              enctype="multipart/form-data">

            <input
                type="file"
                name="file"
                required
            >

            <button type="submit">
                Upload File
            </button>

        </form>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p class="message">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

    </div>

</body>

</html>
